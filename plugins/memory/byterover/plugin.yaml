name: byterover
version: 1.0.0
description: "ByteRover — persistent knowledge tree with tiered retrieval via the brv CLI."
external_dependencies:
  - name: brv
    install: "tmp="$(mktemp)" && curl -fsSL https://byterover.dev/install.sh -o "$tmp" && sh "$tmp" && rm -f "$tmp""
    check: "brv --version"
hooks:
  - on_pre_compress
